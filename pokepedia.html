<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokepedia</title>

  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <main>
    <form id="form" class="search-bar">
      <div id="pokemon-number" class="pokemon-number">0001</div>
      <div class="pokemon-search">
        <input id="pokemon-input" type="text" value="Bulbasaur"
               placeholder="Nom du Pokémon" required autocomplete="off"
               role="combobox" aria-autocomplete="list" aria-expanded="false"
               aria-controls="pokemon-suggestions">
        <ul id="pokemon-suggestions" class="pokemon-suggestions" role="listbox"
            aria-label="Suggestions de Pokémon" hidden></ul>
      </div>
      <button class="search-button" type="submit"><img src="./images/pokeball.png" title="Rechercher"></button>
    </form>

    <div id="error" class="error"></div>

    <section id="pokemon-card">
      <div class="pokemon-display">
        <div id="pokemon-types" class="types"></div>

        <div class="sprite-box">
          <img id="pokemon-sprite" src="" alt="">
        </div>
      </div>

      <section class="panel">
        <h2 id="panel-title" class="panel-title">Capacités</h2>
        <div id="tab-content" class="tab-content"></div>

        <nav class="tabs" aria-label="Informations Pokémon">
          <button id="prev-pokemon" class="nav-button" aria-label="Précédent" title="Précédent">
            <svg xmlns="http://www.w3.org/2000/svg" fill-rule="evenodd" clip-rule="evenodd" viewBox="0 0 299 511.517">
              <path d="M286.421 75.262c36.893-64.702-15.581-96.094-51.926-60.145L25.08 215.793c-33.44 33.44-33.44 46.491 0 79.93L234.495 496.4c36.345 35.949 88.819 4.557 51.926-60.146L189.16 255.758l97.261-180.496z"/>
            </svg>
          </button>
        
          <button class="active" data-tab="abilities" title="Capacités">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 20" fill="var(--base)" class="home">
              <path d="M2 1 L6 1 L6 2 L9 2 L9 1 L13 1 L13 2 L16 2 L16 1 L20 1 L20 5 L19 5 L19 7 L20 7 L20 9 L21 9 L21 11 L20 11 L20 13
              L19 13 L19 15 L20 15 L20 19 L16 19 L16 18 L13 18 L13 19 L9 19 L9 18 L6 18 L6 19 L2 19 L2 15 L3 15 L3 13 L2 13 L2 11 L1 11
              L1 9 L2 9 L2 7 L3 7 L3 5 L2 5 L2 2 L3 2 L3 4 L4 4 L4 8 L3 8 L3 12 L4 12 L4 16 L3 16 L3 18 L5 18 L5 17 L7 17 L7 16 L8 16
              L8 17 L10 17 L10 18 L12 18 L12 17 L14 17 L14 16 L15 16 L15 17 L17 17 L17 18 L19 18 L19 16 L18 16 L18 12 L19 12 L19 8 L18 8
              L18 4 L19 4 L19 4 L19 2 L17 2 L17 3 L15 3 L15 4 L14 4 L14 3 L12 3 L12 2 L10 2 L10 3 L8 3 L8 4 L7 4 L7 3 L5 3 L5 2 L2 2 L2 1
              Z" />
              <path d="M8 6 L14 6 L14 7 L15 7 L15 8 L16 8 L16 12 L15 12 L15 13 L14 13 L14 14 L8 14 L8 13 L7 13 L7 12 L6 12 L6 8 L7 8 L7 7
              L9 7 L9 8 L8 8 L8 9 L7 9 L7 11 L8 11 L8 12 L9 12 L9 13 L13 13 L13 12 L14 12 L14 11 L15 11 L15 9 L14 9 L14 8 L13 8 L13 7 L8 7Z"/>
              <path d="M10 8 L12 8 L12 9 L13 9 L13 11 L12 11 L12 12 L10 12 L10 11 L9 11 L9 9 L 10 9 Z"/>
            </svg>
          </button>
          <button data-tab="basic" title="Informations">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 20" stroke="" fill="var(--base)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="home">
              <path d="M3 0 L10 0 L10 7 L3 7 Z"/>
              <path d="M0 8 L13 8 L13 15 L11 15 L11 10 L10 10 L10 20 L7 20 L7 15 L6 15 L6 20 L3 20 L3 10 L2 10 L2 15 L0 15 Z"/>
              <path d="M14 0 L22 0 L22 20 L20 20 L20 17 L16 17 L16 15 L20 15 L20 12 L16 12 L16 10 L20 10 L20 7 L16 7 L16 5 L20 5 L20 2 L14 2 Z"/>
  <path d="M2 10 L3 10 L3 15 L2 15 Z M10 10 L11 10 L11 15 L10 15 Z M6 15 L7 15 L7 20 L6 20 Z"/>
            </svg>
          </button>
          <button data-tab="stats" title="Stats">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 20" fill="var(--base)" stroke="" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="home">
              <path d="M0 0 L0 20 L22 20 L22 16 L4 16 L4 20 L4 0 Z"/>
              <path d="M5 1 L5 5 L9 5 L9 1 Z"/>
              <path d="M5 6 L19 6 L19 10 L5 10 Z"/>
              <path d="M5 11 L14 11 L14 15 L5 15 Z"/>
            </svg>
          </button>
        
          <button id="next-pokemon" class="nav-button" aria-label="Suivant" title="Suivant">
            <svg xmlns="http://www.w3.org/2000/svg" fill-rule="evenodd" clip-rule="evenodd" viewBox="0 0 299 511.517">
              <path d="M12.579 75.262C-24.314 10.56 28.16-20.832 64.505 15.117L273.92 215.793c33.44 33.44 33.44 46.491 0 79.93L64.505 496.4c-36.345 35.949-88.819 4.557-51.926-60.146l97.261-180.496L12.579 75.262z"/>
            </svg>
          </button>
        </nav>
      </section>
    </section>
  </main>

  <script src="./script.js" defer></script>
</body>
</html>
